<button id="pwa-install" type="button" aria-label="Instalar Pulso">＋ Instalar app</button>
<script>
(() => {
  const installButton = document.getElementById('pwa-install');
  let deferredPrompt = null;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;

  // Android/desktop browsers that support the install prompt.
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredPrompt = event;
    installButton.classList.add('visible');
  });

  // On iPhone/iPad, installation is done from Safari's Share menu.
  const isAppleMobile = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isAppleMobile) installButton.classList.add('visible');

  installButton.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.classList.remove('visible');
      return;
    }
    if (isAppleMobile) {
      alert('Para instalar Pulso en tu iPhone/iPad:\\n1. Abre esta página en Safari.\\n2. Pulsa el botón Compartir.\\n3. Elige “Añadir a pantalla de inicio”.\\n4. Pulsa “Añadir”.');
    } else {
      alert('Si tu navegador permite instalar la app, busca “Instalar app” o “Añadir a pantalla de inicio” en el menú del navegador.');
    }
  });

  window.addEventListener('appinstalled', () => installButton.classList.remove('visible'));
})();
</script>

return `<div class="hc c-${h.col} ${s>=1?'done':''} ${pop===h.id&&s>=1?'pop':''}"><div class="top" data-a="xp" data-id="${h.id}"><span class="ic">${esc(T(h.name)).charAt(0).toUpperCase()}</span><div class="inf"><b>${esc(T(h.name))}</b><small>${s===1?T('Versión mínima lograda'):h.type==='quit'?(s>=2?T('Hoy lo evitaste'):esc(h.goal||T('¿Lo evitaste hoy?'))):esc(h.goal||T(h.trigger)||goal(h))}</small></div><span class="chv ${op?'o':''}">›</span><button class="ck ${s>=2?'on':''}" style="--p:${p}" data-a="tog" data-id="${h.id}" aria-label="${T('Marcar')} ${esc(T(h.name))}"><i>${s===1?'½':'✓'}</i></button></div>${op?xpand(h):''}</div>`}).join('');
if(!hs.length)o+=`<div class="box">${T('Crea tu primer hábito en')} <b>${T('Mis hábitos')}</b>.</div>`;
o+=`<h2>${T('Rutinas')}</h2>`+(S.routines.length?S.routines.map(r=>`<div class="card"><div class="inf"><b>${esc(T(r.name))}</b><small>${r.steps.map(id=>{const h=S.habits.find(x=>x.id===id);return h?esc(T(h.name)):''}).join(' → ')}</small></div><button class="btn" data-a="run" data-id="${r.id}">${T('Empezar')}</button></div>`).join(''):'<p class="mu">'+T('Aún no tienes rutinas.')+'</p>');
return o}
function vHab(){const g=(f)=>S.habits.filter(f);const row=h=>`<div class="card c-${h.col}"><span class="chk dot" style="width:42px;height:42px;font-size:1.2rem;display:grid;place-items:center;border-radius:50%;font-weight:700">${esc(T(h.name)).charAt(0).toUpperCase()}</span><div class="inf"><b>${esc(T(h.name))}</b><small>${freq(h)} · ${h.type==='quit'?T('Dejar'):goal(h)}${h.min?' · '+T('mín.')+' '+h.min:''} · ${h.dur?T('{0} días',h.dur):T('Indefinido')}</small>${h.goal?`<small><b>${esc(h.goal)}</b></small>`:''}${h.trigger?`<small>${esc(T(h.trigger))}</small>`:''}<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-a="edit" data-id="${h.id}">${T('Editar')}</button><button class="btn sm ghost" data-a="pause" data-id="${h.id}">${h.paused?T('Reanudar'):T('Pausar')}</button><button class="btn sm ghost" data-a="arch" data-id="${h.id}">${h.archived?T('Restaurar'):T('Archivar')}</button><button class="btn sm ghost" data-a="fin" data-id="${h.id}">${T(h.type==='quit'?'Lo dejé':'Logrado')}</button></div></div></div>`;
const act=g(h=>!h.paused&&!h.archived&&!h.finished),pa=g(h=>h.paused&&!h.archived&&!h.finished),ar=g(h=>h.archived);
let o=`<h1>${T('Mis hábitos')}</h1><div class="row" style="margin:12px 0"><button class="btn" data-a="new">${T('+ Nuevo hábito')}</button><button class="btn alt" data-a="newq">${T('+ Dejar un hábito')}</button></div><small>${T('Plantillas')}</small><div>${['Leer|📖|10|páginas|1|Después de desayunar','Caminar|🚶|20|min|5|Después de comer','Meditar|🧘|10|min|2|Al despertar','Beber agua|💧|1||0|Al levantarme'].map((t,i)=>`<button class="chip" data-a="tpl" data-i="${i}">${T(t.split('|')[0])}</button>`).join('')}</div>`;
if(act.length>6)o+=`<div class="note">${T('Tienes {0} hábitos activos. Quizá convenga pausar alguno o simplificar sus objetivos.',act.length)}</div>`;
o+=`<h2>${T('Activos')}</h2>`+(act.map(row).join('')||'<p class="mu">'+T('Ninguno todavía.')+'</p>');
if(pa.length)o+=`<h2>${T('En pausa')}</h2>`+pa.map(row).join('');
if(ar.length)o+=`<h2>${T('Archivados')}</h2>`+ar.map(row).join('');
o+=`<h2>${T('Rutinas')}</h2>`+S.routines.map(r=>`<div class="card"><div class="inf"><b>${esc(T(r.name))}</b><small>${r.steps.map(id=>T((S.habits.find(x=>x.id===id)||{}).name)).filter(Boolean).join(' → ')}</small></div><button class="btn sm ghost" data-a="rdel" data-id="${r.id}">${T('Borrar')}</button></div>`).join('')+`<button class="btn alt" data-a="rnew">${T('+ Nueva rutina')}</button>`;
return o}
function heat(){const mon=addD(new Date(),-((new Date().getDay()+6)%7)-77);let c='';for(let i=0;i<84;i++){const d=addD(mon,i);if(d>new Date()){c+='<i style="opacity:0"></i>';continue}const x=dayInfo(d);c+=`<i title="${ds(d)}" style="background:${!x||!x.r?'':x.r>=1?'var(--tl)':x.r>=.5?'var(--gr)':'var(--pk)'}"></i>`}return `<div class="heat">${c}</div>`}
function vPro(){const{cur,rec}=streaks(),w=pct(7),m=pct(30);
const msg=T(w>=80?'Constancia sólida. Esto ya es un hábito en construcción.':w>=50?'Más de la mitad de tus días cuentan. Lo importante es seguir apareciendo.':'Retomar también es progreso. Hoy basta con una versión mínima.');
let o=`<h1>${T('Progreso')}</h1><div class="box rings" style="margin-top:12px"><div class="rg" style="--p:${w};--c:var(--tl)"><b>${w}%</b><small>${T('esta semana')}</small></div><div class="rg" style="--p:${m};--c:var(--gr)"><b>${m}%</b><small>${T('últimos 30 días')}</small></div><div class="rcol"><div class="chp"><b>${cur}</b> ${T('días seguidos activos')}</div><div class="chp"><b>${rec}</b> ${T('récord personal')}</div></div></div><div class="note">${msg}</div>
<h2>${T('Logros')}${ih('logr')}</h2><div class="box">${logros()}</div><h2>${T('Por hábito')}${ih('hab')}</h2><div class="box">${habRows()}</div><h2>${T('Por día de la semana')}${ih('wk')}</h2><div class="box">${wkBars()}</div><h2>${T('Actividad (12 semanas)')}${ih('act')}</h2><div class="box">${heat()}<small>${T('Lila: día completo · verde: a medias · azul: algo es algo')}</small></div>
<h2>${T('Evolución semanal')}${ih('evo')}</h2><div class="box"><div class="bars">${[7,6,5,4,3,2,1,0].map(i=>`<i style="height:${Math.max(4,pct(7,i*7))}%" title="${pct(7,i*7)}%"></i>`).join('')}</div><small>${T('Últimas 8 semanas, de más antigua a más reciente')}</small></div>`;
const rates=S.habits.filter(h=>!h.archived&&!h.paused).map(h=>{let s=0,c=0;for(let i=0;i<7;i++){const d=addD(new Date(),-i);if(sched(h,d)){c++;s+=st(h,ds(d))>=1?1:0}}return{h,r:c?s/c:null}}).filter(x=>x.r!==null).sort((a,b)=>b.r-a.r);
o+=`<h2>${T('Revisión semanal')}${ih('rev')}</h2><div class="box">`;
if(rates.length){const b=rates[0],w2=rates[rates.length-1];o+=`<p>${T('Más constante:')} <b>${b.h.emoji} ${esc(T(b.h.name))}</b> (${Math.round(b.r*100)}%)</p><p>${T('Más difícil:')} <b>${w2.h.emoji} ${esc(T(w2.h.name))}</b> (${Math.round(w2.r*100)}%)</p>`;
o+=`<p class="mu">${w2.r<.5?(w2.h.min?T('Prueba a bajar el objetivo de "{0}" o a moverlo a otro momento del día.',esc(T(w2.h.name))):T('A "{0}" le vendría bien una versión mínima, por ejemplo la mitad del objetivo.',esc(T(w2.h.name)))):T('Tus objetivos parecen realistas. Mantén el ritmo.')}</p>`}else o+='<p class="mu">'+T('Aún no hay datos esta semana.')+'</p>';
o+=`<label>${T('Plan para la próxima semana')}</label><textarea rows="2" data-p="intent" placeholder="${T('¿Qué quieres priorizar?')}">${esc(S.prof.intent)}</textarea></div>
<h2>${T('Coach de hábitos')}</h2><div class="box"><label>${T('Cuéntame qué quieres lograr')}</label><input id="cq" placeholder="${T('Quiero empezar a leer')}"><button class="btn" data-a="coach">${T('Crear plan')}</button>`;
if(coachRes){const p=coachRes;o+=`<p style="margin-top:12px"><b>${esc(T(p.n))}</b> · ${T('empieza pequeño:')}</p><ol>${p.s.map(x=>`<li>${esc(T(x))}</li>`).join('')}</ol><p class="mu">${T('Ancla sugerida: {0}.',esc(T(p.tr)))}</p><button class="btn alt" data-a="coachadd">${T('Añadir primer paso')}</button>`}
return o+`</div>`}
function vPer(){const p=S.prof;return `<h1>${T('Perfil')}</h1><div class="box"><label>${T('Tu nombre')}</label><input data-p="name" value="${esc(p.name)}"><label>${T('Hora del recordatorio')}</label><input type="time" data-p="time" value="${p.time}"><label>${T('Idioma')}</label><select data-p="lang">${[['auto','Automático'],['es','Español'],['en','English']].map(t=>`<option value="${t[0]}" ${(p.lang||'auto')===t[0]?'selected':''}>${T(t[1])}</option>`).join('')}</select><label>${T('Tema')}</label><select data-p="theme">${[['light','Claro'],['dark','Oscuro']].map(t=>`<option value="${t[0]}" ${p.theme===t[0]?'selected':''}>${T(t[1])}</option>`).join('')}</select></div>
<div class="box"><b>${T('Privacidad')}</b><p class="mu">Tus datos se guardan solo en este dispositivo.</p><button class="btn ghost" data-a="reset">${T('Borrar todos mis datos')}</button></div><div class="box"><b>${T('Retos grupales')}</b><p class="mu">${T('Próximamente.')}</p></div>`}
function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('open')}
function close(){$('#modal').classList.remove('open');run=null}
function form(h){ed=h;modal(`<h2 style="margin-top:0">${h.id?T('Editar hábito'):T('Nuevo hábito')}</h2><label>${T('Nombre')}</label><input id="fn" value="${esc(T(h.name))}"><label>${T('Tipo')}</label><div><button class="chip ${h.type==='quit'?'':'on'}" data-a="typ" data-t="build">${T('Construir hábito')}</button><button class="chip ${h.type==='quit'?'on':''}" data-a="typ" data-t="quit">${T('Dejar hábito')}</button></div><!-- --><label>${T('Días')}</label><div>${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${h.days.includes(d)?'on':''}" data-a="day" data-d="${d}">${(L()==='en'?['S','M','T','W','T','F','S']:DN)[d]}</button>`).join('')}</div><div id="bm" style="${h.type==='quit'?'display:none':''}"><div class="row" style="margin-top:10px"><div style="flex:1"><label>${T('Objetivo (cantidad)')}</label><input id="ft" type="number" min="1" value="${h.target}"></div><div style="flex:1"><label>${T('Unidad')}</label><input id="fu" value="${esc(T(h.unit))}" placeholder="${T('min, páginas…')}"></div></div><label>${T('Versión mínima (cantidad, opcional)')}</label><input id="fm" type="number" min="0" value="${h.min||''}"></div><label id="trl">${T(h.type==='quit'?'Qué haré en su lugar':'Lo haré después de…')}</label><input id="fr" value="${esc(T(h.trigger))}" placeholder="${T('Después de desayunar')}"><label>${T('Mi objetivo')}</label><input id="fg" value="${esc(h.goal||'')}" placeholder="${T('Ej.: terminar un libro este mes')}"><label>${T('Meta semanal (días por semana)')}</label><input id="fw" type="number" min="1" max="7" value="${h.wk||h.days.length}"><label>${T('Duración')}</label><div><button class="chip ${!h.dur?'on':''}" data-a="dur" data-v="0">${T('Indefinido')}</button>${[21,30,66,90].map(n=>`<button class="chip ${h.dur===n?'on':''}" data-a="dur" data-v="${n}">${n} ${T('días')}</button>`).join('')}</div><input id="fd" type="number" min="0" value="${h.dur||''}" placeholder="${T('Otro número de días')}"><label>${T('Color')}</label><div>${COL.map(c=>`<button class="chip ${h.col===c?'on':''}" data-a="col" data-c="${c}"><span class="dot c-${c}" style="display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--${c})"></span></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" data-a="save">${T('Guardar')}</button><button class="btn ghost" data-a="close">${T('Cancelar')}</button></div>`)}
const blank=()=>({name:'',emoji:'⭐',days:[0,1,2,3,4,5,6],target:1,unit:'',min:0,trigger:'',col:COL[S.habits.length%4]});
const PLANS=[{k:/le[ea]r|libro|read|book/,n:'Leer',e:'📖',u:'páginas',t:5,m:1,tr:'Después de cenar',s:['Semana 1: 1 página al día','Semana 2: 3 páginas','Semana 3: 5 páginas','Semana 4: sube a 10 solo si te resulta fácil']},{k:/camin|corr|ejerc|entren|deporte|walk|run|exerc|workout|gym/,n:'Caminar',e:'🚶',u:'min',t:15,m:5,tr:'Después de comer',s:['Semana 1: 5 minutos al día','Semana 2: 10 minutos','Semana 3: 15 minutos','Semana 4: añade un día más largo']},{k:/medit|calma|estr[eé]s|calm|stress|mindful/,n:'Meditar',e:'🧘',u:'min',t:5,m:1,tr:'Al despertar',s:['Semana 1: 1 minuto de respiración','Semana 2: 3 minutos','Semana 3: 5 minutos','Semana 4: elige el mejor momento']},{k:/agua|hidrat|water|hydrat/,n:'Beber agua',e:'💧',u:'vasos',t:4,m:1,tr:'Al levantarme',s:['Semana 1: 1 vaso al despertar','Semana 2: 2 vasos','Semana 3: 3 vasos','Semana 4: 4 vasos']}];
function mkPlan(t){const p=PLANS.find(x=>x.k.test(t.toLowerCase()));if(p)return p;const n=(t.replace(/^(quiero|me gustaría|necesito|i want to|i'd like to|i need to)\s+(empezar a\s+|start\s+)?/i,'').trim()||T('Mi nuevo hábito'));const N=n[0].toUpperCase()+n.slice(1);return{n:N,e:'⭐',u:'min',t:10,m:2,tr:'Después de desayunar',s:['Semana 1: solo 2 minutos al día','Semana 2: 5 minutos','Semana 3: 10 minutos','Semana 4: revisa qué momento te funciona mejor']}}
function act(a,d,el){const K1=ds(new Date()),H=id=>S.habits.find(h=>h.id===id);
switch(a){
case'tab':tab=d.t;render();scrollTo(0,0);{const a=$('#app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in')}return;
case'tog':{const h=H(d.id);setV(h.id,st(h,K1)>=2?0:h.target);return}
case'inc':{const h=H(d.id);setV(h.id,val(h,K1)+Math.max(1,Math.round(h.target/5)));return}
case'dec':{const h=H(d.id);setV(h.id,val(h,K1)-Math.max(1,Math.round(h.target/5)));return}
case'min':setV(d.id,H(d.id).min);return;
case'lang':S.prof.lang=L()==='en'?'es':'en';save();render();return;
case'xp':xo[d.id]=!xo[d.id];render();return;
case'info':modal(`<h2 style="margin-top:0">${T(INFO[d.k][0])}</h2><p>${T(INFO[d.k][1])}</p><button class="btn" data-a="close">${T('Entendido')}</button>`);return;
case'snooze':{let[hh,mm]=S.prof.time.split(':').map(Number);S.prof.time=String((hh+1)%24).padStart(2,'0')+':'+String(mm).padStart(2,'0');save();render();return}
case'new':form(blank());return;
case'newq':form({...blank(),type:'quit'});return;
case'typ':ed.type=d.t;document.querySelectorAll('[data-a=typ]').forEach(b=>b.classList.toggle('on',b===el));$('#bm').style.display=d.t==='quit'?'none':'';$('#trl').textContent=T(d.t==='quit'?'Qué haré en su lugar':'Lo haré después de…');return;
case'dur':$('#fd').value=+d.v||'';document.querySelectorAll('[data-a=dur]').forEach(b=>b.classList.toggle('on',b===el));return;
case'fin':{const h=H(d.id);h.finished=true;h.finOn=K1;break}
case'reopen':{const h=H(d.id);h.finished=false;h.finOn='';if(h.dur)h.start=K1;break}
case'tpl':{const t='Leer|📖|10|páginas|1|Después de desayunar,Caminar|🚶|20|min|5|Después de comer,Meditar|🧘|10|min|2|Al despertar,Beber agua|💧|1||0|Al levantarme'.split(',')[d.i].split('|');form({...blank(),name:t[0],emoji:t[1],target:+t[2],unit:t[3],min:+t[4],trigger:t[5]});return}
case'edit':form({...H(d.id)});return;
case'day':{const n=+d.d;ed.days=ed.days.includes(n)?ed.days.filter(x=>x!==n):[...ed.days,n];el.classList.toggle('on');return}
case'col':ed.col=d.c;document.querySelectorAll('[data-a=col]').forEach(b=>b.classList.toggle('on',b===el));return;
case'save':{const n=$('#fn').value.trim();if(!n||!ed.days.length){$('#fn').focus();return}Object.assign(ed,{name:n,emoji:ed.emoji||'',target:Math.max(1,+$('#ft').value||1),unit:$('#fu').value.trim(),min:Math.max(0,+$('#fm').value||0),trigger:$('#fr').value.trim(),goal:$('#fg').value.trim(),wk:Math.min(7,Math.max(1,+$('#fw').value||ed.days.length)),type:ed.type==='quit'?'quit':'build',dur:Math.max(0,Math.round(+$('#fd').value||0))});if(ed.type==='quit'){ed.target=1;ed.min=0;ed.unit=''}if(!ed.start)ed.start=ds(new Date());if(ed.id)S.habits[S.habits.findIndex(h=>h.id===ed.id)]=ed;else{ed.id='h'+Date.now();S.habits.push(ed)}save();close();render();return}
case'pause':{const h=H(d.id);h.paused=!h.paused;break}
case'arch':{const h=H(d.id);h.archived=!h.archived;break}
case'close':close();return;
case'run':run={r:S.routines.find(r=>r.id===d.id),i:0};step();return;
case'next':if(d.ok)setV(d.id,H(d.id).target);run.i++;step();return;
case'rnew':modal(`<h2 style="margin-top:0">${T('Nueva rutina')}</h2><label>${T('Nombre')}</label><input id="rn" placeholder="${T('Rutina de estudio')}"><label>${T('Hábitos, en orden')}</label><div id="rs">${S.habits.filter(h=>!h.archived).map(h=>`<button class="chip" data-a="rpick" data-id="${h.id}">${esc(T(h.name))}</button>`).join('')}</div><p class="mu" id="ro"></p><div class="row" style="margin-top:12px"><button class="btn" data-a="rsave">${T('Guardar')}</button><button class="btn ghost" data-a="close">${T('Cancelar')}</button></div>`);ed=[];return;
case'rpick':{const i=ed.indexOf(d.id);i<0?ed.push(d.id):ed.splice(i,1);el.classList.toggle('on',i<0);$('#ro').textContent=ed.map(id=>T(H(id).name)).join(' → ');return}
case'rsave':{const n=$('#rn').value.trim();if(!n||!ed.length)return;S.routines.push({id:'r'+Date.now(),name:n,steps:ed});break}
case'rdel':S.routines=S.routines.filter(r=>r.id!==d.id);break;
case'coach':{const t=$('#cq').value.trim();if(!t)return;coachRes=mkPlan(t);render();return}
case'coachadd':{const p=coachRes;S.habits.push({...blank(),id:'h'+Date.now(),name:p.n,emoji:p.e,unit:p.u,target:p.s.length?p.t:p.t,min:p.m,trigger:p.tr,goal:T(p.n)+': '+p.t+' '+T(p.u)});coachRes=null;save();tab='hab';render();return}
case'reset':if(el.dataset.s){try{localStorage.removeItem(K)}catch(e){}S=seed();S.habits=[];S.logs={};S.routines=[];save();render()}else{el.dataset.s=1;el.textContent=T('Toca otra vez para confirmar')}return}
save();render()}
function step(){const r=run.r;if(run.i>=r.steps.length){modal(`<h2 style="margin-top:0">${T('¡Rutina completada!')}</h2><p>${T('{0} terminada. Cada paso suma.',esc(T(r.name)))}</p><button class="btn" data-a="close">${T('Cerrar')}</button>`);render();return}
const h=S.habits.find(x=>x.id===r.steps[run.i]);if(!h){run.i++;step();return}
modal(`<small>${T('Paso {0} de {1}',run.i+1,r.steps.length)}</small><h2 style="margin:4px 0 12px;font-size:1.8rem">${esc(T(h.name))}</h2><p class="mu">${esc(T(h.trigger)||goal(h))} · ${goal(h)}</p><div class="row" style="margin-top:16px"><button class="btn" data-a="next" data-id="${h.id}" data-ok="1">${T('Hecho')}</button><button class="btn ghost" data-a="next" data-id="${h.id}">${T('Saltar')}</button><button class="btn ghost" data-a="close">${T('Salir')}</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset,b);else if(e.target.id==='modal')close()});
document.addEventListener('change',e=>{const p=e.target.dataset.p;if(!p)return;S.prof[p]=e.target.value;save();if(p==='theme'||p==='lang')render()});
load();render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker no registrado:', err)));}
